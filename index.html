<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWave // Singularity</title>
    <link rel="icon" id="dynamicFavicon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-base: #050608; --bg-elevated: #14171C; --bg-hover: #1C2027; --border: #262B33;
            --text-primary: #F5F7FA; --text-secondary: #8E96A3; --text-muted: #5C6470;
            --accent: #7C5CFF; --accent-glow: rgba(124, 92, 255, 0.4); --danger: #FF5C7A;
            --glass: rgba(10, 12, 16, 0.85); --blur: 20px; --font-display: 'Space Grotesk', sans-serif;
        }
        body { background-color: var(--bg-base); color: var(--text-primary); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .ambient-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 15% 50%, var(--accent-glow), transparent 40%); z-index: -2; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .sidebar { width: 260px; background: var(--glass); backdrop-filter: blur(var(--blur)); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; gap: 24px; z-index: 10; }
        .logo { font-family: var(--font-display); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; color: var(--accent); }
        .nav-group { display: flex; flex-direction: column; gap: 8px; }
        .nav-item { color: var(--text-secondary); font-weight: 500; font-size: 14px; padding: 12px 16px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { border-left: 3px solid var(--accent); }
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 32px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; }
        .view-section { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view-section.active { display: flex; }
        .track-grid { padding: 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; overflow-y: auto; flex: 1; padding-bottom: 140px; }
        .track-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: 0.3s; }
        .track-card:hover { background: var(--bg-hover); transform: translateY(-4px); border-color: var(--accent); }
        .art-container img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
        .track-artist { color: var(--text-secondary); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-wrapper { position: absolute; bottom: 24px; left: 24px; right: 24px; z-index: 20; }
        .player-bar { height: 96px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .player-left { width: 30%; display: flex; align-items: center; gap: 20px; cursor: pointer; }
        .player-left img { width: 60px; height: 60px; border-radius: 12px; display: none; }
        .player-center { width: 40%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls { display: flex; align-items: center; gap: 28px; }
        .btn-icon { background: none; border: none; color: var(--text-secondary); cursor: pointer; }
        .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--text-primary); color: var(--bg-base); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .progress-container { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 500px; color: var(--text-muted); font-size: 11px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--text-primary); margin-top: -4px; }
        .player-right { width: 30%; display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
        .search-container { padding: 0 40px 20px 40px; }
        .search-input { width: 100%; max-width: 600px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; color: var(--text-primary); outline: none; }
        .chat-box { margin: 0 40px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 24px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { background: var(--bg-hover); padding: 12px; border-radius: 8px; font-size: 14px; }
        .community-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; padding: 40px; }
        .community-card { padding: 24px; border-radius: 16px; color: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 200px; }
    </style>
</head>
<body class="theme-glass" id="bodyTheme">
    <div class="ambient-bg" id="ambientBg"></div>
    <aside class="sidebar">
        <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 12h2l3-9 4 18 4-18 3 9h2"/></svg> OPENWAVE</div>
        <div class="nav-group">
            <a class="nav-item active" onclick="switchTab('home')" id="nav-home">Home</a>
            <a class="nav-item" onclick="switchTab('search')" id="nav-search">Search</a>
            <a class="nav-item" onclick="switchTab('library')" id="nav-library">Library</a>
            <a class="nav-item" onclick="switchTab('community')" id="nav-community">Community</a>
            <a class="nav-item" onclick="switchTab('stats')" id="nav-stats">Wrapped</a>
        </div>
    </aside>
    <main class="main-content">
        <div class="header"><h1 id="page-title">EXPLORE MUSIC</h1></div>
        <div class="view-section active" id="view-home"><div class="track-grid" id="grid-home"></div></div>
        <div class="view-section" id="view-search">
            <div class="search-container"><input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeyup="debounceSearch()"></div>
            <div class="track-grid" id="grid-search"></div>
        </div>
        <div class="view-section" id="view-library"><div class="track-grid" id="grid-library"></div></div>
        <div class="view-section" id="view-community">
            <h2 style="padding: 0 40px 20px 40px;">Trending Community Playlists</h2>
            <div class="community-grid" id="communityGrid"></div>
            <h2 style="padding: 20px 40px;">Global Chat</h2>
            <div class="chat-box" id="chatBox" style="height: 250px;"></div>
            <div style="display:flex; gap:10px; margin: 20px 40px 0 40px;">
                <input type="text" id="chatInput" placeholder="Type a message..." style="flex:1; padding:15px; border-radius:12px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-primary); outline:none;" onkeypress="handleChatEnter(event)">
                <button onclick="sendChatMessage()" style="background:var(--accent); color:#fff; border:none; padding:0 24px; border-radius:12px; font-weight:bold; cursor:pointer;">Send</button>
            </div>
        </div>
        <div class="view-section" id="view-stats">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px; padding:40px;">
                <div style="background:var(--bg-elevated); padding:32px; border-radius:16px; border:1px solid var(--border);"><h3>Total Listening Time</h3><div style="font-size:48px; font-weight:700; color:var(--accent);" id="statTotalTime">0m</div></div>
                <div style="background:var(--bg-elevated); padding:32px; border-radius:16px; border:1px solid var(--border);"><h3>Top Artist</h3><div style="font-size:48px; font-weight:700; color:var(--accent);" id="statTopArtist">-</div></div>
                <div style="grid-column: span 2; background:var(--bg-elevated); padding:32px; border-radius:16px; border:1px solid var(--border);"><canvas id="artistChart" style="max-height: 300px;"></canvas></div>
            </div>
        </div>
        <div class="player-wrapper">
            <div class="player-bar">
                <div class="player-left"><img id="currentArt" src=""><div><div class="track-title" id="currentTitle">Awaiting Input</div><div class="track-artist" id="currentArtist">OpenWave System</div></div></div>
                <div class="player-center">
                    <div class="controls">
                        <button class="btn-icon" onclick="prevTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                        <button class="play-btn" onclick="togglePlay()"><svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="pauseIcon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
                        <button class="btn-icon" onclick="nextTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    </div>
                    <div class="progress-container"><span id="currentTime">0:00</span><input type="range" id="progressBar" min="0" max="100" value="0" onchange="seekAudio(this.value)"><span id="durationTime">0:00</span></div>
                </div>
                <div class="player-right"><input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" onchange="changeVolume(this.value)" style="width: 80px;"></div>
            </div>
        </div>
    </main>
    <audio id="audioPlayer" crossorigin="anonymous"></audio>
    <div id="toastContainer" style="position:fixed; bottom:20px; right:20px; z-index:999;"></div>

    <script>
        const API_BASE = "https://openwaveconnect.onrender.com";
        let allTracks = [];
        let currentIndex = -1;
        let savedTracks = JSON.parse(localStorage.getItem('openwave_library')) || [];
        let stats = JSON.parse(localStorage.getItem('openwave_stats')) || { totalMinutes: 0, topArtists: {} };

        const audio = document.getElementById('audioPlayer');

        function showToast(msg) {
            const c = document.getElementById('toastContainer');
            c.innerHTML = `<div style="background:var(--accent); color:white; padding:12px 24px; border-radius:8px;">${msg}</div>`;
            setTimeout(() => c.innerHTML = '', 3000);
        }

        // Wake up Render Server on load
        async function pingServer() {
            try { await fetch(`${API_BASE}/api/community/playlists`); } catch(e) {}
        }
        pingServer();

        async function fetchHome() {
            const grid = document.getElementById('grid-home');
            grid.innerHTML = '<div style="color:var(--text-secondary); grid-column:1/-1; text-align:center; padding:40px;">Waking up server... (This can take 30-50 seconds on free hosting)</div>';
            
            try {
                const [aRes, jRes] = await Promise.all([
                    fetch(`${API_BASE}/api/audius/trending`).then(r => r.json()), 
                    fetch(`${API_BASE}/api/jamendo/trending`).then(r => r.json())
                ]);
                
                let merged = [];
                if (aRes.data) merged = merged.concat(aRes.data.map(t => ({ id: t.id, title: t.title, artist: t.user.name, artwork: t.artwork?.['150x150'] || '', streamUrl: `${API_BASE}/api/audius/stream/${t.id}` })));
                if (jRes.results) merged = merged.concat(jRes.results.map(t => ({ id: t.id, title: t.name, artist: t.artist_name, artwork: t.image || '', streamUrl: t.audio })));
                
                if(merged.length === 0) {
                    grid.innerHTML = '<div style="color:var(--danger); grid-column:1/-1; text-align:center; padding:40px;">Connected, but returned 0 tracks. Check your API tokens in Render.</div>';
                    return;
                }

                allTracks = merged.sort(() => Math.random() - 0.5);
                renderGrid(allTracks, 'grid-home');
            } catch(e) { 
                grid.innerHTML = '<div style="color:var(--danger); grid-column:1/-1; text-align:center; padding:40px;">Failed to connect. Open Developer Tools (F12) and check Console.</div>'; 
            }
        }

        function renderGrid(tracks, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            tracks.forEach((track, index) => {
                const card = document.createElement('div');
                card.className = 'track-card';
                card.innerHTML = `
                    <div class="art-container"><img src="${track.artwork}" alt="Cover"></div>
                    <div class="track-info"><div class="track-title">${track.title}</div><div class="track-artist">${track.artist}</div></div>
                `;
                card.onclick = () => loadAndPlay(track, index, tracks);
                container.appendChild(card);
            });
        }

        function loadAndPlay(track, index, queueContext) {
            allTracks = queueContext; currentIndex = index;
            document.getElementById('currentTitle').innerText = track.title;
            document.getElementById('currentArtist').innerText = track.artist;
            document.getElementById('currentArt').src = track.artwork;
            document.getElementById('currentArt').style.display = 'block';
            audio.src = track.streamUrl;
            audio.play();
            document.getElementById('playIcon').style.display = 'none';
            document.getElementById('pauseIcon').style.display = 'block';
            logPlay(track);
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) { audio.play(); document.getElementById('playIcon').style.display = 'none'; document.getElementById('pauseIcon').style.display = 'block'; }
            else { audio.pause(); document.getElementById('playIcon').style.display = 'block'; document.getElementById('pauseIcon').style.display = 'none'; }
        }

        function nextTrack() { if (currentIndex < allTracks.length - 1) loadAndPlay(allTracks[currentIndex + 1], currentIndex + 1, allTracks); }
        function prevTrack() { if (currentIndex > 0) loadAndPlay(allTracks[currentIndex - 1], currentIndex - 1, allTracks); }
        function seekAudio(value) { if (audio.duration) audio.currentTime = (value / 100) * audio.duration; }
        function changeVolume(value) { audio.volume = value; }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                document.getElementById('progressBar').value = (audio.currentTime / audio.duration) * 100;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            }
        });
        audio.addEventListener('loadedmetadata', () => { document.getElementById('durationTime').innerText = formatTime(audio.duration); });
        audio.addEventListener('ended', () => nextTrack());

        function debounceSearch() {
            const q = document.getElementById('searchInput').value;
            if(q.length < 2) return;
            fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}`).then(r => r.json()).then(data => {
                let merged = [];
                if (data.audius) merged = merged.concat(data.audius.map(t => ({ id: t.id, title: t.title, artist: t.user.name, artwork: t.artwork?.['150x150'] || '', streamUrl: `${API_BASE}/api/audius/stream/${t.id}` })));
                if (data.jamendo) merged = merged.concat(data.jamendo.map(t => ({ id: t.id, title: t.name, artist: t.artist_name, artwork: t.image || '', streamUrl: t.audio })));
                allTracks = merged; renderGrid(merged, 'grid-search');
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
            if(tab === 'library') renderGrid(savedTracks, 'grid-library');
            if(tab === 'community') fetchCommunity();
        }

        async function fetchCommunity() {
            try {
                const [pRes, cRes] = await Promise.all([
                    fetch(`${API_BASE}/api/community/playlists`).then(r=>r.json()),
                    fetch(`${API_BASE}/api/community/chat`).then(r=>r.json())
                ]);
                const grid = document.getElementById('communityGrid');
                grid.innerHTML = '';
                pRes.playlists.forEach(pl => {
                    grid.innerHTML += `<div class="community-card" style="background: linear-gradient(135deg, ${pl.color}, #14171C);"><div><h3>${pl.name}</h3><p>By ${pl.author}</p></div></div>`;
                });
                renderChat(cRes.messages);
            } catch(e) { console.error(e); }
        }

        function renderChat(messages) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                chatBox.innerHTML += `<div class="chat-msg"><strong style="color:var(--accent)">${msg.user}</strong> <span style="font-size:11px; float:right;">${msg.time}</span><br>${msg.text}</div>`;
            });
        }

        function handleChatEnter(e) { if (e.key === 'Enter') sendChatMessage(); }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            input.value = '';
            try {
                await fetch(`${API_BASE}/api/community/chat`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: "You", text: text, time: timeStr })
                });
                const res = await fetch(`${API_BASE}/api/community/chat`);
                const data = await res.json();
                renderChat(data.messages);
            } catch(e) { showToast("Failed to send message."); }
        }

        function logPlay(track) {
            stats.totalMinutes += 4;
            stats.topArtists[track.artist] = (stats.topArtists[track.artist] || 0) + 1;
            localStorage.setItem('openwave_stats', JSON.stringify(stats));
        }

        function formatTime(s) { if(!s || isNaN(s)) return "0:00"; const m = Math.floor(s / 60); return `${m}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

        fetchHome();
    </script>
</body>
</html>
