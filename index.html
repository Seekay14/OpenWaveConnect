<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWave // Singularity</title>
    <link rel="icon" id="dynamicFavicon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base: #050608; --bg-elevated: #14171C; --bg-hover: #1C2027; --border: #262B33;
            --text-primary: #F5F7FA; --text-secondary: #8E96A3; --text-muted: #5C6470;
            --accent: #7C5CFF; --accent-glow: rgba(124, 92, 255, 0.4); --danger: #FF5C7A;
            --glass: rgba(10, 12, 16, 0.85); --blur: 20px;
            --font-display: 'Space Grotesk', sans-serif;
        }

        body.theme-light { --bg-base: #F0F2F5; --bg-elevated: #FFFFFF; --bg-hover: #E4E6EB; --border: #D1D5DB; --text-primary: #111827; --text-secondary: #4B5563; --text-muted: #9CA3AF; --glass: rgba(255, 255, 255, 0.85); }
        body.theme-cyberpunk { --bg-base: #0A0014; --bg-elevated: #16002B; --bg-hover: #240042; --border: #FF00FF; --text-primary: #00FFFF; --text-secondary: #FF00FF; --text-muted: #8B008B; --accent: #00FFFF; --accent-glow: rgba(0, 255, 255, 0.5); --font-display: 'Courier New', monospace; }

        body { background-color: var(--bg-base); color: var(--text-primary); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; transition: background-color 0.5s; }
        .ambient-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 15% 50%, var(--accent-glow), transparent 40%); z-index: -2; transition: background 1s; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .sidebar { width: 260px; background: var(--glass); backdrop-filter: blur(var(--blur)); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; gap: 24px; z-index: 10; }
        .logo { font-family: var(--font-display); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; text-shadow: 0 0 20px var(--accent-glow); }
        .logo svg { color: var(--accent); }
        .nav-group { display: flex; flex-direction: column; gap: 8px; }
        .nav-item { color: var(--text-secondary); font-weight: 500; font-size: 14px; padding: 12px 16px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { border-left: 3px solid var(--accent); }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 32px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: linear-gradient(to bottom, var(--glass) 0%, transparent 100%); z-index: 5; }
        .header h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; }
        .view-section { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view-section.active { display: flex; }

        .track-grid { padding: 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; overflow-y: auto; flex: 1; padding-bottom: 140px; }
        .track-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: 0.3s; position: relative; }
        .track-card:hover { background: var(--bg-hover); transform: translateY(-4px); border-color: var(--accent); }
        .art-container { position: relative; border-radius: 10px; overflow: hidden; width: 72px; height: 72px; flex-shrink: 0; }
        .track-card img { width: 100%; height: 100%; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; pointer-events: none; }
        .track-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; color: var(--text-primary); }
        .track-artist { color: var(--text-secondary); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .playing-bars { display: none; gap: 2px; align-items: flex-end; height: 14px; margin-left: 8px; }
        .playing-bars span { width: 3px; background: var(--accent); animation: bounce 0.9s infinite alternate; }
        .playing-bars span:nth-child(2) { animation-delay: 0.2s; } .playing-bars span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0% { height: 4px; } 100% { height: 14px; } }
        .track-card.playing .playing-bars { display: flex; }

        .player-wrapper { position: absolute; bottom: 24px; left: 24px; right: 24px; z-index: 20; }
        .player-bar { height: 96px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .player-left { width: 30%; display: flex; align-items: center; gap: 20px; cursor: pointer; }
        .player-left img { width: 60px; height: 60px; border-radius: 12px; display: none; }
        .player-center { width: 40%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls { display: flex; align-items: center; gap: 28px; }
        .btn-icon { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-icon:hover { color: var(--text-primary); }
        .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--text-primary); color: var(--bg-base); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .progress-container { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 500px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--text-primary); margin-top: -4px; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; }
        .player-right { width: 30%; display: flex; align-items: center; justify-content: flex-end; gap: 20px; }

        .now-playing-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-base); z-index: 100; display: flex; align-items: center; justify-content: center; gap: 80px; transform: translateY(100%); transition: transform 0.4s; padding: 40px; }
        .now-playing-screen.active { transform: translateY(0); }
        .np-close { position: absolute; top: 32px; left: 32px; background: none; border: none; color: var(--text-secondary); cursor: pointer; }
        .np-left { display: flex; flex-direction: column; align-items: center; width: 50%; max-width: 500px; }
        .np-art-container { position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 40px; border-radius: 50%; overflow: hidden; border: 10px solid #111; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .np-art { width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        .np-art.playing { animation: spin 12s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #visualizer { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; z-index: 3; }
        .np-info { text-align: center; margin-bottom: 40px; z-index: 2; }
        .np-title { font-family: var(--font-display); font-size: 36px; font-weight: 700; margin-bottom: 8px; }
        .np-artist { color: var(--text-secondary); font-size: 18px; cursor: pointer; text-decoration: underline; }
        .np-controls { display: flex; align-items: center; gap: 40px; }
        .np-controls .play-btn { width: 72px; height: 72px; }
        .np-right { width: 40%; height: 80vh; background: var(--glass); border-radius: 24px; padding: 40px; overflow-y: auto; font-size: 24px; font-weight: 600; line-height: 1.5; color: var(--text-secondary); backdrop-filter: blur(20px); text-align: center; }
        .np-right p { margin-bottom: 16px; transition: 0.3s; }
        .np-right p.active { color: var(--accent); transform: scale(1.05); }

        .cmd-palette { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); width: 600px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; z-index: 1000; display: none; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .cmd-palette.active { display: flex; }
        .cmd-input { width: 100%; padding: 20px; background: transparent; border: none; border-bottom: 1px solid var(--border); color: #fff; font-size: 18px; outline: none; }
        .cmd-results { max-height: 300px; overflow-y: auto; padding: 10px; }
        .cmd-item { padding: 12px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); }
        .cmd-item:hover, .cmd-item.selected { background: var(--bg-hover); color: #fff; }

        #toastContainer { position: fixed; bottom: 130px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: var(--bg-elevated); border-left: 4px solid var(--accent); color: #fff; padding: 16px 24px; border-radius: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 20px; animation: slideIn 0.3s; }
        .toast button { background: var(--accent); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .context-menu { position: absolute; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 8px; z-index: 500; display: none; flex-direction: column; gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 150px; }
        .context-menu.active { display: flex; }
        .context-item { padding: 8px 12px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border-radius: 4px; }
        .context-item:hover { background: var(--bg-hover); color: #fff; }

        .community-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; padding: 40px; }
        .community-card { padding: 24px; border-radius: 16px; color: #fff; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; height: 200px; }
        .community-card:hover { transform: scale(1.02); }
        .chat-box { margin: 0 40px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 24px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { background: var(--bg-hover); padding: 12px; border-radius: 8px; font-size: 14px; }

        .search-container { padding: 0 40px 20px 40px; }
        .search-input { width: 100%; max-width: 600px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; color: var(--text-primary); outline: none; transition: border 0.3s; }
        .search-input:focus { border-color: var(--accent); }
    </style>
</head>
<body class="theme-glass" id="bodyTheme">

    <div class="ambient-bg" id="ambientBg"></div>

    <aside class="sidebar">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 12h2l3-9 4 18 4-18 3 9h2"/></svg>
            OPENWAVE
        </div>
        <div class="nav-group">
            <a class="nav-item active" onclick="switchTab('home')" id="nav-home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Home
            </a>
            <a class="nav-item" onclick="switchTab('search')" id="nav-search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Search
            </a>
            <a class="nav-item" onclick="switchTab('library')" id="nav-library">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg> Library
            </a>
            <a class="nav-item" onclick="switchTab('community')" id="nav-community">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Community
            </a>
            <a class="nav-item" onclick="switchTab('stats')" id="nav-stats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Wrapped
            </a>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="exportData()" style="background:var(--bg-hover); color:var(--text-primary); border:1px solid var(--border); padding:8px; border-radius:8px; cursor:pointer;">Export Data</button>
            <select onchange="changeTheme(this.value)" style="width:100%; background:var(--bg-hover); color:var(--text-primary); border:1px solid var(--border); padding:10px; border-radius:8px;">
                <option value="theme-glass">Glass (Default)</option>
                <option value="theme-light">Light Mode</option>
                <option value="theme-cyberpunk">Cyberpunk</option>
            </select>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1 id="page-title">EXPLORE MUSIC</h1>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:12px; color:var(--text-secondary);">3D Audio</span>
                <input type="range" id="spatialSlider" min="-1" max="1" step="0.1" value="0" oninput="updateSpatialAudio(this.value)" style="width:100px;">
            </div>
        </div>

        <div class="view-section active" id="view-home">
            <div class="track-grid" id="grid-home"></div>
        </div>

        <div class="view-section" id="view-search">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeyup="debounceSearch()">
            </div>
            <div class="track-grid" id="grid-search"></div>
        </div>

        <div class="view-section" id="view-library">
            <div style="padding: 0 40px;"><input type="text" id="libraryFilter" placeholder="Filter library..." onkeyup="renderLibrary()" style="width: 300px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: white; margin-bottom: 20px;"></div>
            <div class="track-grid" id="grid-library"></div>
        </div>

        <div class="view-section" id="view-community">
            <h2 style="padding: 0 40px 20px 40px;">Trending Community Playlists</h2>
            <div class="community-grid" id="communityGrid"></div>
            <h2 style="padding: 20px 40px;">Global Chat</h2>
            <div class="chat-box" id="chatBox" style="height: 250px;"></div>

            <div style="display:flex; gap:10px; margin: 20px 40px 0 40px;">
                <input type="text" id="chatInput" placeholder="Type a message..." style="flex:1; padding:15px; border-radius:12px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-primary); outline:none;" onkeypress="handleChatEnter(event)">
                <button onclick="sendChatMessage()" style="background:var(--accent); color:#fff; border:none; padding:0 24px; border-radius:12px; font-weight:bold; cursor:pointer;">Send</button>
            </div>
        </div>

        <div class="view-section" id="view-stats">
            <div class="stats-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:24px; padding:40px;">
                <div class="stat-card" style="background:var(--bg-elevated); padding:32px; border-radius:16px; border:1px solid var(--border);">
                    <h3>Total Listening Time</h3>
                    <div style="font-size:48px; font-weight:700; color:var(--accent);" id="statTotalTime">0m</div>
                </div>
                <div class="stat-card" style="background:var(--bg-elevated); padding:32px; border-radius:16px; border:1px solid var(--border);">
                    <h3>Top Artist</h3>
                    <div style="font-size:48px; font-weight:700; color:var(--accent);" id="statTopArtist">-</div>
                </div>
                <div class="stat-card" style="grid-column: span 2; background:var(--bg-elevated); padding:32px; border-radius:16px; border:1px solid var(--border);">
                    <canvas id="artistChart" style="max-height: 300px;"></canvas>
                </div>
            </div>
        </div>

        <div class="player-wrapper">
            <div class="player-bar">
                <div class="player-left" onclick="openNowPlaying()">
                    <img id="currentArt" src="" style="display:none;">
                    <div>
                        <div class="track-title" id="currentTitle">Awaiting Input</div>
                        <div class="track-artist" id="currentArtist">OpenWave System</div>
                    </div>
                </div>
                <div class="player-center">
                    <div class="controls">
                        <button class="btn-icon" onclick="surpriseMe()" title="Surprise Me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg></button>
                        <button class="btn-icon" onclick="prevTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                        <button class="play-btn" onclick="togglePlay()">
                            <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="pauseIcon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        <button class="btn-icon" onclick="nextTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    </div>
                    <div class="progress-container">
                        <span id="currentTime">0:00</span>
                        <input type="range" id="progressBar" min="0" max="100" value="0" onchange="seekAudio(this.value)">
                        <span id="durationTime">0:00</span>
                    </div>
                </div>
                <div class="player-right">
                    <select id="reverbSelect" onchange="changeReverb(this.value)" style="background:transparent; color:var(--text-secondary); border:none;">
                        <option value="none">Normal</option>
                        <option value="hall">Hall</option>
                        <option value="stadium">Stadium</option>
                    </select>
                    <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" onchange="changeVolume(this.value)" style="width: 80px;">
                </div>
            </div>
        </div>
    </main>

    <div class="now-playing-screen" id="nowPlayingScreen">
        <button class="np-close" onclick="closeNowPlaying()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="np-left">
            <div class="np-art-container">
                <img id="npArt" class="np-art" src="">
                <canvas id="visualizer"></canvas>
            </div>
            <div class="np-info">
                <div class="np-title" id="npTitle">Track Title</div>
                <div class="np-artist" id="npArtist">Artist Name</div>
            </div>
            <div class="np-controls">
                <button class="btn-icon" onclick="prevTrack()"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="play-btn" onclick="togglePlay()">
                    <svg id="npPlayIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="npPauseIcon" style="display:none;" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-icon" onclick="nextTrack()"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
        </div>
        <div class="np-right" id="lyricsContainer">
            <p style="color:var(--text-muted); text-align:center; margin-top:20%;">Loading lyrics...</p>
        </div>
    </div>

    <div class="cmd-palette" id="cmdPalette">
        <input type="text" class="cmd-input" id="cmdInput" placeholder="Search tracks, tabs, or settings... (Ctrl+K)" onkeyup="handleCmdInput()">
        <div class="cmd-results" id="cmdResults"></div>
    </div>

    <div class="context-menu" id="trackContextMenu">
        <div class="context-item" onclick="playNext()">Play Next</div>
        <div class="context-item" onclick="copyShareLink()">Copy Link</div>
    </div>

    <div id="toastContainer"></div>
    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        let allTracks = [];
        let currentIndex = -1;
        let savedTracks = JSON.parse(localStorage.getItem('openwave_library')) || [];
        let stats = JSON.parse(localStorage.getItem('openwave_stats')) || { totalMinutes: 0, topArtists: {} };
        let activeContextTrackId = null;
        let searchTimeout = null;
        let isCmdOpen = false;

        const audio = document.getElementById('audioPlayer');

        function showToast(msg, undo = false, action = null) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>${msg}</span>`;
            if(undo) {
                const btn = document.createElement('button');
                btn.innerText = "Undo";
                btn.onclick = () => { if(action) action(); toast.remove(); };
                toast.appendChild(btn);
            }
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 5000);
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK') {
                e.preventDefault();
                document.getElementById('cmdPalette').classList.toggle('active');
                document.getElementById('cmdInput').focus();
            }
            if (e.code === 'Escape') document.getElementById('cmdPalette').classList.remove('active');
        });

        function handleCmdInput() {
            const q = document.getElementById('cmdInput').value.toLowerCase();
            const res = document.getElementById('cmdResults');
            res.innerHTML = '';
            const tabs = ['Home', 'Search', 'Library', 'Community', 'Wrapped'];
            tabs.filter(t => t.toLowerCase().includes(q)).forEach(t => {
                res.innerHTML += `<div class="cmd-item" onclick="switchTab('${t.toLowerCase()}'); document.getElementById('cmdPalette').classList.remove('active')">Go to ${t}</div>`;
            });
            if(q.length > 2) {
                allTracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)).slice(0, 5).forEach(t => {
                    res.innerHTML += `<div class="cmd-item" onclick="playFromCmd('${t.id}')">Play: ${t.title} - ${t.artist}</div>`;
                });
            }
        }
        function playFromCmd(id) {
            const track = allTracks.find(t => t.id === id);
            if(track) loadAndPlay(track, allTracks.indexOf(track), allTracks);
            document.getElementById('cmdPalette').classList.remove('active');
        }

        let audioContext, sourceNode, spatialPanner, convolver, dryGain, wetGain;
        function setupAudioEngine() {
            if(audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioContext.createMediaElementSource(audio);
            spatialPanner = audioContext.createPanner();
            convolver = audioContext.createConvolver();
            dryGain = audioContext.createGain(); wetGain = audioContext.createGain();
            wetGain.gain.value = 0;
            sourceNode.connect(spatialPanner); spatialPanner.connect(dryGain); spatialPanner.connect(convolver);
            convolver.connect(wetGain); dryGain.connect(audioContext.destination); wetGain.connect(audioContext.destination);
            generateImpulseResponse(2, 2);
        }
        function generateImpulseResponse(duration, decay) {
            if(!audioContext) return;
            const rate = audioContext.sampleRate, length = rate * duration;
            const impulse = audioContext.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0), right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                const n = length - i;
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
            }
            convolver.buffer = impulse;
        }
        function updateSpatialAudio(val) { if(spatialPanner) spatialPanner.positionX.value = parseFloat(val) * 5; }
        function changeReverb(type) {
            if(!wetGain) return;
            if(type === 'hall') wetGain.gain.value = 0.3;
            else if(type === 'stadium') { generateImpulseResponse(4, 3); wetGain.gain.value = 0.6; }
            else wetGain.gain.value = 0;
        }

        async function fetchCommunity() {
            try {
                const [pRes, cRes] = await Promise.all([
                    fetch('http://127.0.0.1:8000/api/community/playlists').then(r=>r.json()),
                    fetch('http://127.0.0.1:8000/api/community/chat').then(r=>r.json())
                ]);
                const grid = document.getElementById('communityGrid');
                grid.innerHTML = '';
                pRes.playlists.forEach(pl => {
                    grid.innerHTML += `
                        <div class="community-card" style="background: linear-gradient(135deg, ${pl.color}, #14171C);">
                            <div><h3 style="font-size:20px; margin-bottom:8px;">${pl.name}</h3><p style="opacity:0.8; font-size:14px;">By ${pl.author}</p></div>
                            <div style="display:flex; justify-content:space-between; font-size:12px; opacity:0.7;"><span>${pl.tracks_count} tracks</span><span>${pl.plays} plays</span></div>
                        </div>
                    `;
                });
                renderChat(cRes.messages);
                const chatBox = document.getElementById('chatBox');
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch(e) { console.error(e); }
        }

        function renderChat(messages) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                chatBox.innerHTML += `<div class="chat-msg"><strong style="color:var(--accent)">${msg.user}</strong> <span style="font-size:11px; color:var(--text-muted); float:right;">${msg.time}</span><br>${msg.text}</div>`;
            });
        }

        function handleChatEnter(e) { if (e.key === 'Enter') sendChatMessage(); }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            input.value = '';
            try {
                await fetch('http://127.0.0.1:8000/api/community/chat', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: "You", text: text, time: timeStr })
                });
                const res = await fetch('http://127.0.0.1:8000/api/community/chat');
                const data = await res.json();
                renderChat(data.messages);
                const chatBox = document.getElementById('chatBox');
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch(e) { showToast("Failed to send message."); }
        }

        function updateDynamicTheme(imageUrl) {
            const img = new Image(); img.crossOrigin = "Anonymous"; img.src = imageUrl;
            img.onload = function() {
                try {
                    const colorThief = new ColorThief();
                    const rgb = colorThief.getColor(img);
                    const brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
                    let fr = rgb[0], fg = rgb[1], fb = rgb[2];
                    if (brightness < 80) { fr = Math.min(255, fr + 80); fg = Math.min(255, fg + 80); fb = Math.min(255, fb + 80); }
                    const hex = "#" + ((1 << 24) + (fr << 16) + (fg << 8) + fb).toString(16).slice(1);
                    document.documentElement.style.setProperty('--accent', hex);
                    document.documentElement.style.setProperty('--accent-glow', `rgba(${fr}, ${fg}, ${fb}, 0.4)`);
                } catch(e) {}
            };
        }
        function updateFavicon(url) { document.getElementById('dynamicFavicon').href = url; }

        function loadAndPlay(track, index, queueContext, autoplay = true) {
            allTracks = queueContext; currentIndex = index;
            document.getElementById('currentTitle').innerText = track.title;
            document.getElementById('currentArtist').innerText = track.artist;
            document.getElementById('currentArt').src = track.artwork;
            document.getElementById('currentArt').style.display = 'block';
            document.getElementById('npTitle').innerText = track.title;
            document.getElementById('npArtist').innerText = track.artist;
            document.getElementById('npArt').src = track.artwork;
            updateDynamicTheme(track.artwork);
            updateFavicon(track.artwork);
            logPlay(track);
            fetchLyrics(track.artist, track.title);
            audio.src = track.streamUrl;
            setupAudioEngine();
            if(autoplay) {
                audio.volume = 0; audio.play();
                fadeAudio(0, document.getElementById('volumeBar').value, 1000);
                updatePlayState(true);
            }
        }

        function fadeAudio(from, to, duration) {
            const steps = 20, stepTime = duration / steps, diff = to - from;
            let currentStep = 0;
            const fadeInterval = setInterval(() => {
                currentStep++; audio.volume = Math.max(0, Math.min(1, from + (diff * (currentStep / steps))));
                if (currentStep >= steps) clearInterval(fadeInterval);
            }, stepTime);
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) { audio.play(); updatePlayState(true); }
            else { audio.pause(); updatePlayState(false); }
        }

        function updatePlayState(isPlaying) {
            document.getElementById('playIcon').style.display = isPlaying ? 'none' : 'block';
            document.getElementById('pauseIcon').style.display = isPlaying ? 'block' : 'none';
            document.getElementById('npPlayIcon').style.display = isPlaying ? 'none' : 'block';
            document.getElementById('npPauseIcon').style.display = isPlaying ? 'block' : 'none';
            const art = document.getElementById('npArt');
            if(isPlaying) art.classList.add('playing'); else art.classList.remove('playing');
            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing'));
            if(isPlaying) document.querySelectorAll(`.track-card[data-id="${allTracks[currentIndex]?.id}"]`).forEach(c => c.classList.add('playing'));
        }

        function nextTrack() {
            if (currentIndex < allTracks.length - 1) loadAndPlay(allTracks[currentIndex + 1], currentIndex + 1, allTracks);
            else fetchSmartRadio().then(() => { if (currentIndex < allTracks.length - 1) loadAndPlay(allTracks[currentIndex + 1], currentIndex + 1, allTracks); });
        }
        function prevTrack() { if (currentIndex > 0) loadAndPlay(allTracks[currentIndex - 1], currentIndex - 1, allTracks); }
        function seekAudio(value) { if (audio.duration) audio.currentTime = (value / 100) * audio.duration; }
        function changeVolume(value) { audio.volume = value; }

        function surpriseMe() {
            if(allTracks.length === 0) return;
            const r = Math.floor(Math.random() * allTracks.length);
            loadAndPlay(allTracks[r], r, allTracks);
            showToast("Playing a random track!");
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                document.getElementById('progressBar').value = (audio.currentTime / audio.duration) * 100;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            }
        });
        audio.addEventListener('loadedmetadata', () => { document.getElementById('durationTime').innerText = formatTime(audio.duration); });
        audio.addEventListener('ended', () => nextTrack());

        async function fetchHome() {
            document.getElementById('grid-home').innerHTML = '<div style="padding:20px; color:var(--text-muted);">Syncing...</div>';
            try {
                const [aRes, jRes] = await Promise.all([fetch('http://127.0.0.1:8000/api/audius/trending').then(r => r.json()), fetch('http://127.0.0.1:8000/api/jamendo/trending').then(r => r.json())]);
                let merged = [];
                if (aRes.data) merged = merged.concat(aRes.data.map(t => ({ id: t.id, title: t.title, artist: t.user.name, artwork: t.artwork?.['150x150'] || '', streamUrl: `http://127.0.0.1:8000/api/audius/stream/${t.id}` })));
                if (jRes.results) merged = merged.concat(jRes.results.map(t => ({ id: t.id, title: t.name, artist: t.artist_name, artwork: t.image || '', streamUrl: t.audio })));
                allTracks = merged.sort(() => Math.random() - 0.5);
                renderGrid(allTracks, 'grid-home');
            } catch(e) { document.getElementById('grid-home').innerHTML = '<div style="color:var(--danger)">Failed to connect to proxy.</div>'; }
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const q = document.getElementById('searchInput').value;
                if(q.length < 2) return;
                fetch(`http://127.0.0.1:8000/api/search?q=${encodeURIComponent(q)}`).then(r => r.json()).then(data => {
                    let merged = [];
                    if (data.audius) merged = merged.concat(data.audius.map(t => ({ id: t.id, title: t.title, artist: t.user.name, artwork: t.artwork?.['150x150'] || '', streamUrl: `http://127.0.0.1:8000/api/audius/stream/${t.id}` })));
                    if (data.jamendo) merged = merged.concat(data.jamendo.map(t => ({ id: t.id, title: t.name, artist: t.artist_name, artwork: t.image || '', streamUrl: t.audio })));
                    allTracks = merged; renderGrid(merged, 'grid-search');
                });
            }, 500);
        }

        function renderGrid(tracks, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            tracks.forEach((track, index) => {
                const isSaved = savedTracks.some(t => t.id === track.id);
                const isPlaying = currentIndex > -1 && allTracks[currentIndex]?.id === track.id;
                const card = document.createElement('div');
                card.className = `track-card ${isPlaying ? 'playing' : ''}`;
                card.setAttribute('data-id', track.id);
                card.innerHTML = `
                    <div class="art-container"><img src="${track.artwork}" alt="Cover"></div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-artist">${track.artist}</div>
                    </div>
                    <div class="playing-bars"><span></span><span></span><span></span></div>
                    <div class="card-actions">
                        <button class="action-btn ${isSaved ? 'active' : ''}" onclick="toggleSave('${track.id}', event)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button class="action-btn" onclick="openContextMenu(event, '${track.id}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                        </button>
                    </div>
                `;
                card.onclick = (e) => { if(!e.target.closest('.action-btn')) loadAndPlay(track, index, tracks); };
                container.appendChild(card);
            });
        }

        function renderLibrary() {
            const q = document.getElementById('libraryFilter')?.value.toLowerCase() || '';
            const filtered = savedTracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
            renderGrid(filtered, 'grid-library');
        }

        function toggleSave(trackId, event) {
            event.stopPropagation();
            const index = savedTracks.findIndex(t => t.id === trackId);
            if(index > -1) {
                const removed = savedTracks.splice(index, 1)[0];
                showToast("Removed from Library", true, () => { savedTracks.push(removed); localStorage.setItem('openwave_library', JSON.stringify(savedTracks)); });
            }
            else { const trackToSave = allTracks.find(t => t.id === trackId); if(trackToSave) { savedTracks.push(trackToSave); showToast("Saved to Library"); } }
            localStorage.setItem('openwave_library', JSON.stringify(savedTracks));
            if(document.getElementById('view-library').classList.contains('active')) renderLibrary();
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');

            if(tab === 'home') document.getElementById('page-title').innerText = "EXPLORE MUSIC";
            if(tab === 'search') document.getElementById('page-title').innerText = "SEARCH DATABASE";
            if(tab === 'library') { document.getElementById('page-title').innerText = "SAVED ARCHIVE"; renderLibrary(); }
            if(tab === 'community') { document.getElementById('page-title').innerText = "COMMUNITY HUB"; fetchCommunity(); }
            if(tab === 'stats') { document.getElementById('page-title').innerText = "YOUR WRAPPED"; renderStats(); }
        }

        function openContextMenu(e, trackId) {
            e.stopPropagation(); activeContextTrackId = trackId;
            const menu = document.getElementById('trackContextMenu');
            menu.style.top = `${e.pageY}px`; menu.style.left = `${e.pageX}px`;
            menu.classList.add('active');
        }
        function playNext() { const track = allTracks.find(t => t.id === activeContextTrackId); if(track) { allTracks.splice(currentIndex + 1, 0, track); showToast("Playing next"); } closeContextMenu(); }
        function copyShareLink() { navigator.clipboard.writeText(`https://openwave.app/track/${activeContextTrackId}`); showToast("Link copied!"); closeContextMenu(); }
        function closeContextMenu() { document.getElementById('trackContextMenu').classList.remove('active'); }
        document.addEventListener('click', closeContextMenu);

        function openNowPlaying() { if(audio.src) document.getElementById('nowPlayingScreen').classList.add('active'); }
        function closeNowPlaying() { document.getElementById('nowPlayingScreen').classList.remove('active'); }

        function logPlay(track) {
            stats.totalMinutes += 4;
            stats.topArtists[track.artist] = (stats.topArtists[track.artist] || 0) + 1;
            localStorage.setItem('openwave_stats', JSON.stringify(stats));
        }
        function renderStats() {
            document.getElementById('statTotalTime').innerText = `${stats.totalMinutes} mins`;
            const sorted = Object.entries(stats.topArtists).sort((a,b) => b[1] - a[1]);
            if(sorted.length > 0) document.getElementById('statTopArtist').innerText = sorted[0][0];
            const ctx = document.getElementById('artistChart').getContext('2d');
            if(window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, { type: 'bar', data: { labels: sorted.slice(0, 5).map(x => x[0]), datasets: [{ data: sorted.slice(0, 5).map(x => x[1]), backgroundColor: 'rgba(124, 92, 255, 0.8)', borderRadius: 8 }] }, options: { plugins: { legend: { display: false } } } });
        }

        async function fetchLyrics(artist, title) {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20%;">Loading lyrics...</p>';
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/lyrics?artist=${encodeURIComponent(artist)}&title=${encodeURIComponent(title)}`);
                const data = await res.json();
                if (data.lyrics && !data.lyrics.includes("not found")) {
                    container.innerHTML = '';
                    data.lyrics.split('\n').filter(l => l.trim() !== '').forEach((line, index) => { container.innerHTML += `<p id="lyric-line-${index}">${line}</p>`; });
                } else { container.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20%;">Lyrics not available.</p>'; }
            } catch(e) { container.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20%;">Failed to load lyrics.</p>'; }
        }

        function exportData() {
            const data = { library: savedTracks, stats: stats };
            const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "openwave_backup.json"; a.click();
            showToast("Data exported successfully!");
        }

        async function fetchSmartRadio() {
            if(allTracks.length === 0) return;
            const lastTrack = allTracks[allTracks.length - 1];
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/search?q=${encodeURIComponent(lastTrack.artist)}`);
                const data = await res.json();
                let newTracks = [];
                if (data.audius) newTracks = newTracks.concat(data.audius.map(t => ({ id: t.id, title: t.title, artist: t.user.name, artwork: t.artwork?.['150x150'] || '', streamUrl: `http://127.0.0.1:8000/api/audius/stream/${t.id}` })));
                if (data.jamendo) newTracks = newTracks.concat(data.jamendo.map(t => ({ id: t.id, title: t.name, artist: t.artist_name, artwork: t.image || '', streamUrl: t.audio })));
                allTracks = [...allTracks, ...newTracks.filter(nt => !allTracks.some(at => at.id === nt.id))];
            } catch(e) {}
        }

        function formatTime(s) { if(!s || isNaN(s)) return "0:00"; const m = Math.floor(s / 60); return `${m}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }
        function changeTheme(theme) { document.getElementById('bodyTheme').className = theme; showToast(`Theme changed!`); }

        fetchHome();
    </script>
</body>
</html>
